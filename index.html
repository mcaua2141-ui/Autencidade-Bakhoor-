<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Autenticidade | wiemoth</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cormorant Garamond', Georgia, serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #1a1710 0%, #0a0a0a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2.5rem 1rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(20, 20, 20, 0.8);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid var(--gold);
        }

        .brand-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--gold);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: lowercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        main {
            width: 90%;
            max-width: 450px;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Tela de Segurança Inicial */
        .gate-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: left;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .gate-domain {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--gold);
            margin: 0 0 0.75rem 0;
            letter-spacing: 0.3px;
        }

        .gate-heading {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 0.75rem 0;
            line-height: 1.4;
        }

        .gate-description {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 1.8rem 0;
        }

        .challenge-box {
            background-color: #1c1c1c;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 8px;
            padding: 1rem 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .challenge-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .human-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--gold);
            border-radius: 4px;
            background: #121212;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .human-checkbox:hover {
            border-color: var(--gold-light);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.25);
        }

        .human-checkbox.checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .human-checkbox.checked::after {
            content: '✓';
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .challenge-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #2e2e2e;
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: none;
            flex-shrink: 0;
        }

        .challenge-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .challenge-badge {
            text-align: right;
            font-family: 'Montserrat', sans-serif;
            line-height: 1.25;
            flex-shrink: 0;
        }

        .challenge-badge-title {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--gold);
            display: block;
        }

        .challenge-badge-links {
            font-size: 0.62rem;
            color: var(--text-muted);
        }

        /* Card Principal de Autenticidade */
        .verification-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
        }

        .spinner-container {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 2rem;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid #262626;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            font-size: 1.3rem;
