 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Autenticidade | wiemoth</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1e1e1e;
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid #d4af37;
            margin-bottom: 40px;
        }
        .logo {
            width: 40px;
            height: 40px;
            background-color: #d4af37;
            border-radius: 50%;
        }
        .brand-name {
            color: #d4af37;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo"></div>
        <div class="brand-name">wiemoth</div>
    </header>

    <div class="card">
        <h2>Verificação de Segurança</h2>
        <p>Confirme que você é humano para continuar.</p>
        <button class="btn" onclick="verificar()">Verificar</button>
        <div id="status" style="margin-top: 20px; font-weight: bold;"></div>
    </div>

    <script>
        function verificar() {
            document.getElementById('status').innerText = 'Verificando...';
            setTimeout(() => {
                document.getElementById('status').innerText = '✓ Verificado com sucesso!';
                document.getElementById('status').style.color = '#10b981';
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    window.location.href = 'autenticidade.html?' + params.toString();
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
